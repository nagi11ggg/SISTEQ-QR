<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Padres - CECYTEQ San Juan del Río</title>
    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAMSdJbBCh7za9CSV0oKSL9QLE8OyyQhJs",
            authDomain: "cecyqr-pro.firebaseapp.com",
            projectId: "cecyqr-pro",
            storageBucket: "cecyqr-pro.firebasestorage.app",
            messagingSenderId: "35266770164",
            appId: "1:35266770164:web:b92bd883c3bd3a26941aa1",
            measurementId: "G-8R0R1377Y5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.FB_db = db;
        window.FB_collection = collection;
        window.FB_getDocs = getDocs;
        window.FB_doc = doc;
        window.FB_getDoc = getDoc;

        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
        :root {
            --bg-light: #f1f5f9;
            --card-bg: #ffffff;
            --cecyteq-green: #059669;
            --cecyteq-green-hover: #047857;
            --cecyteq-orange: #f97316;
            --cecyteq-orange-hover: #ea580c;
            --cecyteq-blue: #2563eb;
            --text-main: #0f172a;
            --text-gray: #475569;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
            --danger-red: #dc2626;
        }

        body.dark-mode {
            --bg-light: #0b0f19;
            --card-bg: #131c2e;
            --text-main: #f1f5f9;
            --text-gray: #94a3b8;
            --border-color: #22324f;
            --input-bg: #1a263d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
        body { background-color: var(--bg-light); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; padding: 15px; align-items: center; }
        
        .gen-container { max-width: 520px; width: 100%; background: var(--card-bg); padding: 22px; border-radius: 20px; box-shadow: 0 15px 35px rgba(5, 150, 105, 0.12); border: 2px solid var(--cecyteq-green); margin-top: 10px; margin-bottom: 20px; }
        .gen-header { text-align: center; margin-bottom: 20px; position: relative; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .gen-header h1 { color: var(--cecyteq-green); font-size: 1.4rem; font-weight: 800; margin-top: 5px; }
        .gen-header p { color: var(--text-gray); font-size: 0.8rem; }
        
        .top-tools { position: absolute; right: 0; top: 0; display: flex; gap: 5px; }
        .btn-tool { background: var(--input-bg); border: 1.5px solid var(--border-color); color: var(--text-main); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; }

        .select-card-group { background: var(--input-bg); border: 2px solid var(--border-color); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; text-align: left; }
        .select-card-group:focus-within { border-color: var(--cecyteq-green); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }
        
        .select-card-label { display: block; font-size: 0.78rem; font-weight: 800; color: var(--cecyteq-green); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
        .select-card-group select { width: 100%; padding: 6px 2px; border: none; font-size: 0.9rem; background: transparent; color: var(--text-main); outline: none; font-weight: 700; cursor: pointer; }

        .row-parcial-container { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); border: 2px solid var(--border-color); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
        .row-parcial-label { font-size: 0.78rem; font-weight: 800; color: var(--cecyteq-green); text-transform: uppercase; }
        .select-parcial-small { padding: 5px 10px; border: 1.5px solid var(--cecyteq-green); border-radius: 8px; font-size: 0.85rem; font-weight: 800; color: var(--cecyteq-green); background: var(--card-bg); outline: none; cursor: pointer; }

        .btn-generar { background: linear-gradient(135deg, var(--cecyteq-green), var(--cecyteq-green-hover)); color: white; border: none; padding: 13px; border-radius: 12px; font-size: 0.95rem; font-weight: 800; cursor: pointer; width: 100%; box-shadow: 0 6px 15px rgba(5, 150, 105, 0.25); margin-top: 4px; }
        .btn-generar:active { transform: scale(0.98); }

        .report-section { display: none; margin-top: 20px; border-top: 2px dashed var(--border-color); padding-top: 15px; }
        .card-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: var(--input-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 10px; text-align: center; }
        .stat-box h4 { font-size: 0.75rem; color: var(--text-gray); text-transform: uppercase; margin-bottom: 4px; }
        .stat-box p { font-size: 1.1rem; font-weight: 800; color: var(--cecyteq-green); }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-main); }
        th { background: rgba(5, 150, 105, 0.15); color: var(--cecyteq-green); font-weight: 800; }

        .badge-estado { padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; display: inline-block; text-align: center; }
        .badge-regular { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .badge-recuperacion { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
        .badge-recursamiento { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        .modal-custom { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); justify-content: center; align-items: center; z-index: 2000; padding: 15px; backdrop-filter: blur(4px); }
        .modal-custom-content { background: var(--card-bg); padding: 22px; border-radius: 16px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); border-top: 5px solid var(--cecyteq-green); }
        .modal-custom-title { color: var(--cecyteq-green); font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
        .modal-custom-body { color: var(--text-gray); font-size: 0.88rem; margin-bottom: 18px; line-height: 1.4; text-align: left; background: var(--input-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .modal-custom-btn { background: linear-gradient(135deg, var(--cecyteq-green), var(--cecyteq-green-hover)); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 800; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="gen-container">
        <div class="gen-header">
            <div class="top-tools">
                <button class="btn-tool" onclick="toggleDarkMode()" title="Cambiar Modo">🌙</button>
            </div>
            <div style="font-size: 2rem; margin-bottom: 2px;">👪</div>
            <h1>Portal de Padres y Tutores</h1>
            <p>CECYTEQ • Plantel San Juan del Río</p>
        </div>

        <div class="select-card-group">
            <label class="select-card-label">👨‍🏫 Selecciona al Docente</label>
            <select id="selectDocente" onchange="cargarGruposDocente()">
                <option value="">-- Seleccione Docente --</option>
            </select>
        </div>

        <div class="select-card-group">
            <label class="select-card-label">📁 Selecciona el Grupo</label>
            <select id="selectGrupo" onchange="cargarAlumnosGrupo()">
                <option value="">-- Seleccione Grupo --</option>
            </select>
        </div>

        <div class="select-card-group">
            <label class="select-card-label">👤 Selecciona a tu Hijo(a)</label>
            <select id="selectAlumno">
                <option value="">-- Seleccione Alumno --</option>
            </select>
        </div>

        <div class="row-parcial-container">
            <span class="row-parcial-label">📊 Selecciona el Parcial</span>
            <select id="selectParcial" class="select-parcial-small">
                <option value="1er Parcial">1er Parcial</option>
                <option value="2do Parcial">2do Parcial</option>
                <option value="3er Parcial">3er Parcial</option>
            </select>
        </div>

        <button class="btn-generar" onclick="consultarProgresoPadre()">📈 Consultar Estadísticas y Tareas</button>

        <div id="reportSection" class="report-section">
            <h3 id="lblNombreEstudiante" style="color: var(--cecyteq-green); font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; text-align: center;">Estudiante: --</h3>
            
            <div class="card-stats">
                <div class="stat-box">
                    <h4>Calificación Final</h4>
                    <p id="lblStatFinal">0.0</p>
                </div>
                <div class="stat-box">
                    <h4>Estado Actual</h4>
                    <p id="lblStatEstado" style="font-size: 0.9rem;">Regular</p>
                </div>
                <div class="stat-box">
                    <h4>Firmas Acumuladas</h4>
                    <p id="lblStatFirmas">0</p>
                </div>
                <div class="stat-box">
                    <h4>Examen</h4>
                    <p id="lblStatExamen">0</p>
                </div>
            </div>

            <h4 style="font-size: 0.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;">📋 Tareas y Actividades Asignadas:</h4>
            <div id="tablaTareasContainer" style="overflow-x: auto; max-height: 220px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- MODAL DE ALERTA -->
    <div id="modalCustomAlert" class="modal-custom">
        <div class="modal-custom-content">
            <div style="font-size: 2rem; margin-bottom: 4px;">🔔</div>
            <div id="modalCustomTitle" class="modal-custom-title">Aviso</div>
            <div id="modalCustomText" class="modal-custom-body">Mensaje aquí</div>
            <button class="modal-custom-btn" onclick="cerrarModalCustom()">Entendido</button>
        </div>
    </div>

    <script>
        let docentesCache = {};
        let docenteSeleccionadoObj = null;
        let grupoSeleccionadoObj = null;

        function reproducirSonido(tipo) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (tipo === 'exito') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else {
                    osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                }
            } catch(e) {}
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            let isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('cecyteq_padres_dark', isDark ? '1' : '0');
            reproducirSonido('click');
        }

        if (localStorage.getItem('cecyteq_padres_dark') === '1') {
            document.body.classList.add('dark-mode');
        }

        function mostrarAlertaCustom(titulo, mensaje) {
            document.getElementById('modalCustomTitle').innerText = titulo;
            document.getElementById('modalCustomText').innerText = mensaje;
            document.getElementById('modalCustomAlert').style.display = 'flex';
            reproducirSonido('exito');
        }
        function cerrarModalCustom() {
            document.getElementById('modalCustomAlert').style.display = 'none';
            reproducirSonido('click');
        }

        window.addEventListener('firebase-ready', async () => {
            await cargarDocentesFirebase();
        });

        async function cargarDocentesFirebase() {
            try {
                const querySnapshot = await window.FB_getDocs(window.FB_collection(window.FB_db, "docentes"));
                const selectDocente = document.getElementById('selectDocente');
                selectDocente.innerHTML = '<option value="">-- Seleccione Docente --</option>';
                docentesCache = {};

                querySnapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    docentesCache[data.user] = data;
                    let opt = document.createElement('option');
                    opt.value = data.user;
                    opt.innerText = data.nombre;
                    selectDocente.appendChild(opt);
                });
            } catch(e) {
                mostrarAlertaCustom("Error", "No se pudieron cargar los docentes desde la nube.");
            }
        }

        function cargarGruposDocente() {
            let userDocente = document.getElementById('selectDocente').value;
            let selectGrupo = document.getElementById('selectGrupo');
            selectGrupo.innerHTML = '<option value="">-- Seleccione Grupo --</option>';
            document.getElementById('selectAlumno').innerHTML = '<option value="">-- Seleccione Alumno --</option>';
            document.getElementById('reportSection').style.display = 'none';

            if (!userDocente || !docentesCache[userDocente]) return;
            docenteSeleccionadoObj = docentesCache[userDocente];

            if (docenteSeleccionadoObj.grupos) {
                docenteSeleccionadoObj.grupos.forEach(g => {
                    let opt = document.createElement('option');
                    opt.value = g.id;
                    opt.innerText = g.nombre;
                    selectGrupo.appendChild(opt);
                });
            }
            reproducirSonido('click');
        }

        function cargarAlumnosGrupo() {
            let grupoId = document.getElementById('selectGrupo').value;
            let selectAlumno = document.getElementById('selectAlumno');
            selectAlumno.innerHTML = '<option value="">-- Seleccione Alumno --</option>';
            document.getElementById('reportSection').style.display = 'none';

            if (!grupoId || !docenteSeleccionadoObj) return;
            grupoSeleccionadoObj = docenteSeleccionadoObj.grupos.find(g => g.id == grupoId);

            if (grupoSeleccionadoObj && grupoSeleccionadoObj.alumnos) {
                grupoSeleccionadoObj.alumnos.forEach(a => {
                    let opt = document.createElement('option');
                    opt.value = a.id;
                    opt.innerText = a.nombre;
                    selectAlumno.appendChild(opt);
                });
            }
            reproducirSonido('click');
        }

        function consultarProgresoPadre() {
            let grupoId = document.getElementById('selectGrupo').value;
            let alumnoId = document.getElementById('selectAlumno').value;
            let parcialKey = document.getElementById('selectParcial').value;

            if (!grupoId || !alumnoId) {
                mostrarAlertaCustom("Datos Incompletos", "⚠️ Por favor selecciona el grupo y el nombre de tu hijo(a).");
                return;
            }

            let alumno = grupoSeleccionadoObj.alumnos.find(a => a.id == alumnoId);
            let parcialObj = grupoSeleccionadoObj.parciales ? grupoSeleccionadoObj.parciales[parcialKey] : null;
            let califData = parcialObj && parcialObj.calificaciones ? parcialObj.calificaciones[alumnoId] : null;

            document.getElementById('lblNombreEstudiante').innerText = `Estudiante: ${alumno.nombre} (${parcialKey})`;

            let badgeClass = "badge-regular";
            let estadoTxt = alumno.estado || "Regular";
            if (estadoTxt === 'Recuperación') badgeClass = "badge-recuperacion";
            if (estadoTxt === 'Recursamiento') badgeClass = "badge-recursamiento";

            document.getElementById('lblStatEstado').innerHTML = `<span class="badge-estado ${badgeClass}">${estadoTxt}</span>`;

            if (!califData) {
                document.getElementById('lblStatFinal').innerText = "0.0";
                document.getElementById('lblStatFirmas').innerText = "0";
                document.getElementById('lblStatExamen').innerText = "0";
                document.getElementById('tablaTareasContainer').innerHTML = `<p style="text-align:center; padding:10px; color:var(--text-gray);">Sin registros de tareas en este parcial.</p>`;
            } else {
                document.getElementById('lblStatFinal').innerText = califData.califFinal || "0.0";
                document.getElementById('lblStatFinal').style.color = (califData.califFinal >= 6) ? "var(--cecyteq-green)" : "var(--danger-red)";
                document.getElementById('lblStatFirmas').innerText = califData.firmas || 0;
                document.getElementById('lblStatExamen').innerText = califData.examen || 0;

                let tareasList = parcialObj.tareas || [];
                if (tareasList.length === 0) {
                    document.getElementById('tablaTareasContainer').innerHTML = `<p style="text-align:center; padding:10px; color:var(--text-gray);">El docente aún no ha publicado actividades en este parcial.</p>`;
                } else {
                    let html = `<table><thead><tr><th>Actividad</th><th>Estado de Entrega</th></tr></thead><tbody>`;
                    tareasList.forEach((t, i) => {
                        let entregada = califData.tareasStatus && califData.tareasStatus[t.id];
                        let estadoBadge = entregada ? 
                            `<span style="color:var(--cecyteq-green); font-weight:bold;">✅ Entregada / Firmada</span>` : 
                            `<span style="color:var(--danger-red); font-weight:bold;">❌ Pendiente</span>`;
                        
                        html += `<tr><td><b>ACT ${i+1}:</b> ${t.nombre}</td><td>${estadoBadge}</td></tr>`;
                    });
                    html += `</tbody></table>`;
                    document.getElementById('tablaTareasContainer').innerHTML = html;
                }
            }

            document.getElementById('reportSection').style.display = 'block';
            reproducirSonido('exito');
        }
    </script>
</body>
</html>
